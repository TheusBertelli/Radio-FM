plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.fmlab.redmi'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.fmlab.redmi'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
